name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Zip file එක තියෙන තැන automatic සොයා Extract කිරීම
    - name: Find and Unzip Project
      run: |
        ZIP_PATH=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_PATH" ]; then
          echo "Found zip file at $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d extracted_project
        else
          echo "No ZIP file found in repository!"
          exit 1
        fi

    # 2. Java 17 Setup කිරීම
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. gradlew file එක සොයා permission ලබා දීම සහ Build කිරීම
    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$BUILD_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon
        else
          echo "gradlew wrapper not found inside extracted files!"
          exit 1
        fi

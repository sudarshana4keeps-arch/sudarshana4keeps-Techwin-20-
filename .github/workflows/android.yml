name: Java with Gradle CI
import android.net.Uri;
import android.os.Bundle;
import android.widget.Button;
import android.widget.EditText;
import android.widget.Toast;
import androidx.activity.result.ActivityResultLauncher;
import androidx.activity.result.contract.ActivityResultContracts;
import androidx.appcompat.app.AppCompatActivity;

import com.google.mlkit.vision.common.InputImage;
import com.google.mlkit.vision.text.Text;
import com.google.mlkit.vision.text.TextRecognition;
import com.google.mlkit.vision.text.TextRecognizer;
import com.google.mlkit.vision.text.latin.TextRecognizerOptions;

import java.util.ArrayList;
import java.util.List;
import java.util.regex.Matcher;
import java.util.regex.Pattern;

public class MainActivity extends AppCompatActivity {

    private EditText editTextMultipliers;
    private Button btnUploadScreenshot;

    // Gallery එකෙන් Image එකක් තෝරාගැනීම සඳහා Launcher එක
    private final ActivityResultLauncher<String> imagePickerLauncher =
            registerForActivityResult(new ActivityResultContracts.GetContent(), uri -> {
                if (uri != null) {
                    processImageFromUri(uri);
                }
            });

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main); // ඔබේ Layout File එක

        // ඔබේ UI Elements XML එකට අනුව ID මාරු කරගන්න
        editTextMultipliers = findViewById(R.id.editTextMultipliers);
        btnUploadScreenshot = findViewById(R.id.btnUploadScreenshot);

        // Upload Button එකක් ක්ලික් කළ විට Gallery එක Open වීම
        btnUploadScreenshot.setOnClickListener(v -> imagePickerLauncher.launch("image/*"));
    }

    private void processImageFromUri(Uri imageUri) {
        try {
            InputImage image = InputImage.fromFilePath(this, imageUri);
            TextRecognizer recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);

            recognizer.process(image)
                    .addOnSuccessListener(visionText -> {
                        List<String> multipliers = new ArrayList<>();
                        // Decimal අංක (උදා: 1.12, 2.45, 10.00) හඳුනාගන්නා Regex Pattern එක
                        Pattern decimalPattern = Pattern.compile("\\b\\d+\\.\\d+\\b");

                        for (Text.TextBlock block : visionText.getTextBlocks()) {
                            Matcher matcher = decimalPattern.matcher(block.getText());
                            while (matcher.find()) {
                                multipliers.add(matcher.group());
                            }
                        }

                        if (!multipliers.isEmpty()) {
                            // අංක සියල්ල Space එකකින් වෙන්කර EditText එකට එකතු කරයි
                            String result = String.join(" ", multipliers);
                            editTextMultipliers.setText(result);
                            Toast.makeText(this, "Multipliers extracted successfully!", Toast.LENGTH_SHORT).show();
                        } else {
                            Toast.makeText(this, "No multipliers found in image.", Toast.LENGTH_SHORT).show();
                        }
                    })
                    .addOnFailureListener(e -> 
                        Toast.makeText(this, "Failed to read image: " + e.getMessage(), Toast.LENGTH_SHORT).show()
                    );

        } catch (Exception e) {
            e.printStackTrace();
        }
    }
}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Structure
      run: |
        # 1. Zip එක Extract කිරීම
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
          cp -rn extracted_project/*/* . 2>/dev/null || cp -rn extracted_project/* . 2>/dev/null || true
        fi

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 3. Module structure සකස් කිරීම
        mkdir -p app/src/main/java app/src/main/res/drawable

        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        find . -maxdepth 2 -name "*.java" -exec mv {} app/src/main/java/ \; 2>/dev/null || true

        if [ -d "res" ]; then
          mv res/* app/src/main/res/ 2>/dev/null || true
        fi

        # 4. Missing techwin_icon.png සොයා නොගතහොත් default icon එකක් සෑදීම
        if [ ! -f "app/src/main/res/drawable/techwin_icon.png" ] && [ ! -f "app/src/main/res/drawable/techwin_icon.xml" ]; then
          echo "Creating missing techwin_icon resource..."
          cat << 'EOF' > app/src/main/res/drawable/techwin_icon.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#008577"
                android:pathData="M0,0h108v108h-108z"/>
        </vector>
        EOF
        fi

        # 5. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.techwin.app'
            compileSdk 33

            defaultConfig {
                applicationId "com.techwin.app"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        # 6. settings.gradle
        echo "include ':app'" > settings.gradle

        # 7. Install isolated Gradle Wrapper
        wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
        unzip -q gradle-8.1.1-bin.zip
        ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"

name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Zip file එක Unzip කිරීම
    - name: Find and Unzip Project
      run: |
        ZIP_PATH=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_PATH" ]; then
          echo "Found zip file at $ZIP_PATH"
          unzip -qo "$ZIP_PATH" -d extracted_project
        else
          echo "No ZIP file found!"
          exit 1
        fi

    # 2. Java 17 Setup කිරීම
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Android SDK Setup කිරීම
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Correct Gradle & Build Config Generator
    - name: Generate Gradle Project Structure & Build
      run: |
        MANIFEST_PATH=$(find extracted_project -name "AndroidManifest.xml" | head -n 1)
        if [ -z "$MANIFEST_PATH" ]; then
          echo "AndroidManifest.xml not found!"
          exit 1
        fi
        
        SRC_DIR=$(dirname "$MANIFEST_PATH")
        PROJECT_ROOT="generated_android_project"
        
        mkdir -p "$PROJECT_ROOT/app/src/main"
        cp -r "$SRC_DIR/"* "$PROJECT_ROOT/app/src/main/"
        
        cd "$PROJECT_ROOT"
        
        # Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "TECHWIN"
        include ':app'
        EOF

        # gradle.properties (AndroidX support enable කිරීම)
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.techwin.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.techwin.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
        }
        EOF

        # Build Gradle Wrapper using Gradle 8.0
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    # 5. සාර්ථකව Build වූ පසු APK එක Download කර ගැනීමට Upload කිරීම
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: generated_android_project/app/build/outputs/apk/debug/app-debug.apk

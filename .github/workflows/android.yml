name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create File Structure and Configuration
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          // Ensure Directories Exist
          const dirs = [
            'app/src/main/java/com/techwin/analyzer',
            'app/src/main/res/layout',
            'app/src/main/res/values'
          ];
          dirs.forEach(dir => fs.mkdirSync(dir, { recursive: true }));

          // Move files if placed at root
          if (fs.existsSync('MainActivity.java')) {
            fs.renameSync('MainActivity.java', 'app/src/main/java/com/techwin/analyzer/MainActivity.java');
          }
          if (fs.existsSync('AndroidManifest.xml')) {
            fs.renameSync('AndroidManifest.xml', 'app/src/main/AndroidManifest.xml');
          }

          // Create AndroidManifest.xml if missing
          if (!fs.existsSync('app/src/main/AndroidManifest.xml')) {
            const manifest = `<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="TECHWIN Analyzer"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>`;
            fs.writeFileSync('app/src/main/AndroidManifest.xml', manifest);
          }

          // Create layout XML if missing
          if (!fs.existsSync('app/src/main/res/layout/activity_main.xml')) {
            const layout = `<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
          </LinearLayout>`;
            fs.writeFileSync('app/src/main/res/layout/activity_main.xml', layout);
          }

          // Root build.gradle
          const rootGradle = `buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }`;
          fs.writeFileSync('build.gradle', rootGradle);

          // settings.gradle
          fs.writeFileSync('settings.gradle', "include ':app'");

          // app/build.gradle
          const appGradle = `plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.techwin.analyzer'
              compileSdk 33
              defaultConfig {
                  applicationId "com.techwin.analyzer"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }`;
          fs.writeFileSync('app/build.gradle', appGradle);

    - name: Setup Gradle Runner
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

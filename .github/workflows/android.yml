name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK using Android SDK Direct Command
      run: |
        mkdir -p app/src/main/java/com/techwin/analyzer
        mkdir -p app/src/main/res/layout
        
        # Check and Move MainActivity if needed
        if [ -f "MainActivity.java" ]; then
          mv MainActivity.java app/src/main/java/com/techwin/analyzer/MainActivity.java
        fi
        
        # Create Minimal build.gradle if missing
        if [ ! -f "build.gradle" ]; then
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.1' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
        fi
        
        if [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle
        fi
        
        if [ ! -f "app/build.gradle" ]; then
          mkdir -p app
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.techwin.analyzer'; compileSdk 33; defaultConfig { applicationId 'com.techwin.analyzer'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" >> app/build.gradle
        fi

        # Run Gradle Build
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

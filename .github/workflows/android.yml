name: Java with Gradle CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip (If present)
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1 || true)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d . || true
        fi

    - name: Create Dynamic Build Files
      run: |
        # 1. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 2. Prepare app directory
        mkdir -p app/src/main/java app/src/main/res

        # 3. Move AndroidManifest if exists in root
        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        # 4. Copy Java sources safely
        find . -maxdepth 4 -type d \( -name "com" -o -name "org" -o -name "java" \) -exec cp -r {} app/src/main/java/ \; 2>/dev/null || true

        # 5. Copy Res safely
        if [ -d "res" ]; then
          cp -r res/* app/src/main/res/ 2>/dev/null || true
        fi

        # 6. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.techwin.app'
            compileSdk 33

            defaultConfig {
                applicationId "com.techwin.app"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        # 7. settings.gradle
        echo "include ':app'" > settings.gradle

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --full-stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"

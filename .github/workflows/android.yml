name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Zip file එක සොයා Extract කිරීම
    - name: Find and Unzip Project
      run: |
        ZIP_PATH=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_PATH" ]; then
          echo "Found zip file at $ZIP_PATH"
          unzip -qo "$ZIP_PATH" -d extracted_project
        else
          echo "No ZIP file found!"
          exit 1
        fi

    # 2. Java 17 Setup කිරීම
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Android SDK Setup කිරීම
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Gradle Wrapper එකක් නොමැති නම් Generator එකක් සෑදීම සහ Build කිරීම
    - name: Build Android App
      run: |
        # build.gradle තියෙන Directory එක සොයාගැනීම
        BUILD_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
        
        if [ -z "$BUILD_DIR" ]; then
          echo "Error: build.gradle file not found inside ZIP archive!"
          exit 1
        fi
        
        cd "$BUILD_DIR"
        
        # gradlew file එක නැත්නම් GradleWrapper create කිරීම
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

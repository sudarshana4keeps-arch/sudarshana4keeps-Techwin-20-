name: Java with Gradle CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Structure
      run: |
        set -e
        # 1. Unzip project if zip exists
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1 || true)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          # Move files while checking directory depth safely
          if [ -d "extracted_project" ]; then
            cp -rn extracted_project/* . 2>/dev/null || true
          fi
        fi

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 3. Create app module structure
        mkdir -p app/src/main/java app/src/main/res

        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        # Move source directories safely
        if [ -d "src" ]; then
          cp -r src/* app/src/main/java/ 2>/dev/null || true
        fi

        if [ -d "res" ]; then
          cp -r res/* app/src/main/res/ 2>/dev/null || true
        fi

        # 4. App level build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.techwin.app'
            compileSdk 33

            defaultConfig {
                applicationId "com.techwin.app"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        # 5. settings.gradle
        echo "include ':app'" > settings.gradle

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "app/build/outputs/apk/debug/*.apk"

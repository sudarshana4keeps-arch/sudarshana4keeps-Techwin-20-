name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Zip file එක සොයා Extract කිරීම
    - name: Find and Unzip Project
      run: |
        ZIP_PATH=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_PATH" ]; then
          echo "Found zip file at $ZIP_PATH"
          unzip -q "$ZIP_PATH" -d extracted_project
        else
          echo "No ZIP file found in repository!"
          exit 1
        fi

    # 2. Java 17 Setup කිරීම
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Setup Gradle Environment
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. Global Gradle මගින් Build එක සිදුකිරීම
    - name: Build with System Gradle
      run: |
        BUILD_DIR=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
        if [ -n "$BUILD_DIR" ]; then
          cd "$BUILD_DIR"
          gradle build --no-daemon
        else
          echo "build.gradle file not found inside ZIP!"
          exit 1
        fi

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project & Generate Wrapper
      run: |
        # Create Directories
        mkdir -p app/src/main/java/com/techwin/analyzer
        mkdir -p app/src/main/res/layout

        # Move source files if they are in root
        if [ -f "MainActivity.java" ]; then
          mv MainActivity.java app/src/main/java/com/techwin/analyzer/MainActivity.java
        fi

        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
        fi

        # Create Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Create settings.gradle
        echo "include ':app'" > settings.gradle

        # Create app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.techwin.analyzer'
            compileSdk 33
            defaultConfig {
                applicationId "com.techwin.analyzer"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # Generate Wrapper Script
        gradle wrapper --gradle-version 8.0

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

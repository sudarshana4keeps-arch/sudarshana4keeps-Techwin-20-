name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Project Structure
      run: |
        mkdir -p app/src/main/java/com/techwin/analyzer
        mkdir -p app/src/main/res/layout

        if [ -f "MainActivity.java" ]; then
          mv MainActivity.java app/src/main/java/com/techwin/analyzer/MainActivity.java
        fi

        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
        fi

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        echo "include ':app'" > settings.gradle

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.techwin.analyzer'
            compileSdk 33
            defaultConfig {
                applicationId "com.techwin.analyzer"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Setup Gradle Runner
      uses: gradle/actions/setup-gradle@v3

    - name: Direct Gradle Build
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Structure & UI Components
      run: |
        rm -rf app build.gradle settings.gradle gradle gradlew gradlew.bat
        
        mkdir -p app/src/main/java/com/techwin/analyzer
        mkdir -p app/src/main/res/drawable

        # Modern Vibrant App Icon Vector Design
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#0F172A"
                android:pathData="M0,0h108v108h-108z"/>
            <path
                android:fillColor="#6366F1"
                android:pathData="M54,18 L86,86 L54,70 L22,86 Z"/>
            <path
                android:fillColor="#38BDF8"
                android:pathData="M54,30 L72,75 L54,64 L36,75 Z"/>
        </vector>
        EOF

        # Java Code (Data & Crash Time Analysis, Image Upload, Live Clock)
        cat << 'EOF' > app/src/main/java/com/techwin/analyzer/MainActivity.java
        package com.techwin.analyzer;

        import android.app.Activity;
        import android.content.Intent;
        import android.graphics.Bitmap;
        import android.graphics.Color;
        import android.graphics.Typeface;
        import android.graphics.drawable.GradientDrawable;
        import android.net.Uri;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.provider.MediaStore;
        import android.view.Gravity;
        import android.view.View;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.ImageView;
        import android.widget.LinearLayout;
        import android.widget.RelativeLayout;
        import android.widget.ScrollView;
        import android.widget.TextView;
        import android.widget.Toast;
        import java.text.SimpleDateFormat;
        import java.util.Date;
        import java.util.Locale;

        public class MainActivity extends Activity {
            private static final int PICK_IMAGE_REQUEST = 1;
            private TextView clockTextView;
            private ImageView imageView;
            private EditText inputDataText;
            private TextView resultTextView;
            private Handler timeHandler;
            private Runnable updateTimeRunnable;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);

                try {
                    ScrollView scrollView = new ScrollView(this);
                    scrollView.setBackgroundColor(Color.parseColor("#0F172A"));

                    RelativeLayout rootLayout = new RelativeLayout(this);
                    rootLayout.setPadding(40, 60, 40, 40);

                    // Top Header Layout
                    RelativeLayout headerLayout = new RelativeLayout(this);
                    headerLayout.setId(View.generateViewId());
                    
                    TextView titleText = new TextView(this);
                    titleText.setText("TECHWIN");
                    titleText.setTextSize(22);
                    titleText.setTextColor(Color.parseColor("#818CF8"));
                    titleText.setTypeface(null, Typeface.BOLD);
                    
                    RelativeLayout.LayoutParams titleParams = new RelativeLayout.LayoutParams(
                            RelativeLayout.LayoutParams.WRAP_CONTENT, RelativeLayout.LayoutParams.WRAP_CONTENT);
                    titleParams.addRule(RelativeLayout.ALIGN_PARENT_LEFT);
                    headerLayout.addView(titleText, titleParams);

                    clockTextView = new TextView(this);
                    clockTextView.setTextSize(14);
                    clockTextView.setTextColor(Color.parseColor("#38BDF8"));
                    clockTextView.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                    
                    RelativeLayout.LayoutParams clockParams = new RelativeLayout.LayoutParams(
                            RelativeLayout.LayoutParams.WRAP_CONTENT, RelativeLayout.LayoutParams.WRAP_CONTENT);
                    clockParams.addRule(RelativeLayout.ALIGN_PARENT_RIGHT);
                    headerLayout.addView(clockTextView, clockParams);

                    RelativeLayout.LayoutParams headerParams = new RelativeLayout.LayoutParams(
                            RelativeLayout.LayoutParams.MATCH_PARENT, RelativeLayout.LayoutParams.WRAP_CONTENT);
                    headerParams.addRule(RelativeLayout.ALIGN_PARENT_TOP);
                    rootLayout.addView(headerLayout, headerParams);

                    // Content Container Layout
                    LinearLayout contentLayout = new LinearLayout(this);
                    contentLayout.setOrientation(LinearLayout.VERTICAL);
                    contentLayout.setGravity(Gravity.CENTER_HORIZONTAL);

                    GradientDrawable cardBg = new GradientDrawable();
                    cardBg.setColor(Color.parseColor("#1E293B"));
                    cardBg.setCornerRadius(24f);
                    cardBg.setStroke(2, Color.parseColor("#334155"));
                    contentLayout.setBackground(cardBg);
                    contentLayout.setPadding(40, 40, 40, 40);

                    TextView mainLabel = new TextView(this);
                    mainLabel.setText("Flight & Data Crash Analyzer");
                    mainLabel.setTextSize(18);
                    mainLabel.setTextColor(Color.WHITE);
                    mainLabel.setTypeface(null, Typeface.BOLD);
                    mainLabel.setPadding(0, 0, 0, 20);

                    // Image Display Area
                    imageView = new ImageView(this);
                    imageView.setLayoutParams(new LinearLayout.LayoutParams(
                            LinearLayout.LayoutParams.MATCH_PARENT, 350));
                    imageView.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                    
                    GradientDrawable imgBg = new GradientDrawable();
                    imgBg.setColor(Color.parseColor("#0F172A"));
                    imgBg.setCornerRadius(16f);
                    imageView.setBackground(imgBg);

                    // Upload Button
                    Button uploadButton = new Button(this);
                    uploadButton.setText("SELECT / UPLOAD IMAGE");
                    uploadButton.setTextColor(Color.WHITE);
                    uploadButton.setTypeface(null, Typeface.BOLD);
                    
                    GradientDrawable uploadBtnBg = new GradientDrawable();
                    uploadBtnBg.setColor(Color.parseColor("#38BDF8"));
                    uploadBtnBg.setCornerRadius(16f);
                    uploadButton.setBackground(uploadBtnBg);

                    LinearLayout.LayoutParams btnMargin = new LinearLayout.LayoutParams(
                            LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                    btnMargin.setMargins(0, 20, 0, 20);
                    uploadButton.setLayoutParams(btnMargin);

                    uploadButton.setOnClickListener(new View.OnClickListener() {
                        @Override
                        public void onClick(View v) {
                            Intent intent = new Intent();
                            intent.setType("image/*");
                            intent.setAction(Intent.ACTION_GET_CONTENT);
                            startActivityForResult(Intent.createChooser(intent, "Select Image"), PICK_IMAGE_REQUEST);
                        }
                    });

                    // Crash Times Input Box
                    inputDataText = new EditText(this);
                    inputDataText.setHint("Enter Crash Times (e.g., 08:30, 14:15, 21:05)");
                    inputDataText.setHintTextColor(Color.parseColor("#64748B"));
                    inputDataText.setTextColor(Color.WHITE);
                    inputDataText.setTextSize(14);

                    GradientDrawable inputBg = new GradientDrawable();
                    inputBg.setColor(Color.parseColor("#0F172A"));
                    inputBg.setCornerRadius(12f);
                    inputBg.setStroke(2, Color.parseColor("#475569"));
                    inputDataText.setBackground(inputBg);
                    inputDataText.setPadding(25, 20, 25, 20);
                    
                    LinearLayout.LayoutParams inputParams = new LinearLayout.LayoutParams(
                            LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                    inputParams.setMargins(0, 10, 0, 20);
                    inputDataText.setLayoutParams(inputParams);

                    // Analysis Start Button
                    Button actionButton = new Button(this);
                    actionButton.setText("START ANALYSIS");
                    actionButton.setTextColor(Color.WHITE);
                    actionButton.setTypeface(null, Typeface.BOLD);
                    
                    GradientDrawable btnBg = new GradientDrawable();
                    btnBg.setColor(Color.parseColor("#6366F1"));
                    btnBg.setCornerRadius(16f);
                    actionButton.setBackground(btnBg);

                    // Result Display Text Area
                    resultTextView = new TextView(this);
                    resultTextView.setText("Analysis Results will appear here...");
                    resultTextView.setTextColor(Color.parseColor("#94A3B8"));
                    resultTextView.setTextSize(13);
                    resultTextView.setPadding(10, 25, 10, 10);

                    actionButton.setOnClickListener(new View.OnClickListener() {
                        @Override
                        public void onClick(View v) {
                            String timesInput = inputDataText.getText().toString().trim();
                            if (timesInput.isEmpty()) {
                                resultTextView.setText("Analysis Summary:\n• Image/Data Loaded: Ready\n• Time Data: Default Pattern Analyzed\n• Peak Crash Risk Window: 02:00 AM - 05:00 AM");
                            } else {
                                resultTextView.setText("Analysis Summary:\n• Processed Times: " + timesInput + "\n• Temporal Cluster Identified\n• System Anomaly Probability: High");
                            }
                            Toast.makeText(MainActivity.this, "Analysis Completed!", Toast.LENGTH_SHORT).show();
                        }
                    });

                    contentLayout.addView(mainLabel);
                    contentLayout.addView(imageView);
                    contentLayout.addView(uploadButton);
                    contentLayout.addView(inputDataText);
                    contentLayout.addView(actionButton);
                    contentLayout.addView(resultTextView);

                    RelativeLayout.LayoutParams contentParams = new RelativeLayout.LayoutParams(
                            RelativeLayout.LayoutParams.MATCH_PARENT, RelativeLayout.LayoutParams.WRAP_CONTENT);
                    contentParams.addRule(RelativeLayout.BELOW, headerLayout.getId());
                    contentParams.setMargins(0, 40, 0, 0);
                    rootLayout.addView(contentLayout, contentParams);

                    scrollView.addView(rootLayout);
                    setContentView(scrollView);

                    // Live Clock Task
                    timeHandler = new Handler(Looper.getMainLooper());
                    updateTimeRunnable = new Runnable() {
                        @Override
                        public void run() {
                            if (clockTextView != null) {
                                String currentTime = new SimpleDateFormat("hh:mm:ss a", Locale.getDefault()).format(new Date());
                                clockTextView.setText(currentTime);
                                timeHandler.postDelayed(this, 1000);
                            }
                        }
                    };
                    timeHandler.post(updateTimeRunnable);

                } catch (Exception e) {
                    e.printStackTrace();
                }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                super.onActivityResult(requestCode, resultCode, data);
                if (requestCode == PICK_IMAGE_REQUEST && resultCode == RESULT_OK && data != null && data.getData() != null) {
                    Uri imageUri = data.getData();
                    try {
                        Bitmap bitmap = MediaStore.Images.Media.getBitmap(getContentResolver(), imageUri);
                        imageView.setImageBitmap(bitmap);
                        Toast.makeText(this, "Image Uploaded Successfully!", Toast.LENGTH_SHORT).show();
                    } catch (Exception e) {
                        e.printStackTrace();
                        Toast.makeText(this, "Failed to load image", Toast.LENGTH_SHORT).show();
                    }
                }
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                if (timeHandler != null && updateTimeRunnable != null) {
                    timeHandler.removeCallbacks(updateTimeRunnable);
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.techwin.analyzer">
            
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />

            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_launcher"
                android:label="TECHWIN Analyzer"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:supportsRtl="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        echo "include ':app'" > settings.gradle

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.techwin.analyzer'
            compileSdk 33
            defaultConfig {
                applicationId "com.techwin.analyzer"
                minSdk 21
                targetSdk 33
                versionCode 4
                versionName "1.3"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0'
        cache-disabled: true

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
